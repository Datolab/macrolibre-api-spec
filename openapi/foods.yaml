openapi: 3.1.0
info:
  title: Kcal Verified Food DB API
  version: 0.1.0
  license:
    name: CC0 1.0 Universal
    identifier: CC0-1.0
  description: >-
    Food search, verified lookups, and community submissions (SRS Epic B:
    FR-B-1..7). Tiered by caller (free/Pro/B2B) — see
    `common/components.yaml`'s security schemes.
servers:
  - url: https://api.datocal.com
security:
  - anonymousClientId: []
  - bearerAuth: []
  - apiKeyAuth: []
paths: {}
components:
  securitySchemes:
    anonymousClientId:
      $ref: './common/components.yaml#/components/securitySchemes/anonymousClientId'
    bearerAuth:
      $ref: './common/components.yaml#/components/securitySchemes/bearerAuth'
    apiKeyAuth:
      $ref: './common/components.yaml#/components/securitySchemes/apiKeyAuth'
