components:
  securitySchemes:
    anonymousClientId:
      type: apiKey
      in: header
      name: X-Client-Id
      description: >-
        Client-generated identifier for free-tier/anonymous callers, used
        only for daily quota accounting (FR-F-1). Not an auth mechanism —
        carries no privileges beyond quota tracking.
    bearerAuth:
      type: http
      scheme: bearer
      description: Kcal Pro user session token (FR-F-2).
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: B2B keyed access, metered per contract (FR-F-4).

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: >-
        Opaque pagination cursor from a previous response's `next_cursor`.
        Clients must not parse or construct this value.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        maximum: 100

  headers:
    RateLimitLimit:
      description: The caller's quota ceiling for the current window.
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: Unix timestamp when the current window resets.
      schema:
        type: integer
    RetryAfter:
      description: Seconds to wait before retrying, present on 429 responses.
      schema:
        type: integer

  schemas:
    Page:
      type: object
      required: [data, next_cursor]
      properties:
        next_cursor:
          type: [string, 'null']

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    ProvenanceBadge:
      type: string
      description: >-
        Trust provenance shown on every result (FR-B-3), most to least
        authoritative.
      enum:
        - official
        - dietitian_verified
        - open_data
        - user_submitted

    Food:
      type: object
      description: >-
        A food record with per-100g macronutrients. Shared between the Food DB
        API (Epic B) and dataset release payloads (Epic C).
      required:
        - id
        - name_en
        - provenance_badge
        - kcal_100g
        - protein_100g
        - carbs_100g
        - fat_100g
      properties:
        id:
          type: string
          format: uuid
        name_en:
          type: string
          description: English name.
        name_es:
          type: [string, 'null']
          description: Spanish name, when available.
        region:
          type: [string, 'null']
          description: Region code the food is most relevant to (e.g. `GT`).
        provenance_badge:
          $ref: '#/components/schemas/ProvenanceBadge'
        kcal_100g:
          type: number
          minimum: 0
          description: Energy per 100 g, in kilocalories.
        protein_100g:
          type: number
          minimum: 0
          description: Protein per 100 g, in grams.
        carbs_100g:
          type: number
          minimum: 0
          description: Carbohydrate per 100 g, in grams.
        fat_100g:
          type: number
          minimum: 0
          description: Fat per 100 g, in grams.

  responses:
    TooManyRequests:
      description: Caller is over their tier's quota (FR-F-1/F-2/F-4).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
